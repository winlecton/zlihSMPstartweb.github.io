
```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZLIH SMP - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">

    <div class="login-card">
        <div class="logo">ZLIH SMP</div>
        <p class="subtitle">Server Control Panel</p>

        <form id="loginForm">
            <label for="username">Username</label>
            <input id="username" type="text" placeholder="Username" autocomplete="username" required>

            <label for="password">Password</label>
            <input id="password" type="password" placeholder="Password" autocomplete="current-password" required>

            <button type="submit" class="primary-button">LOGIN</button>

            <p id="loginError" class="error-message"></p>
        </form>

        <p class="security-note">
            🔒 Secure authentication will be connected to the Control API later.
        </p>
    </div>

    <script src="loginhandler.js"></script>
</body>
</html>
